name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
  - type: input
    id: client
    attributes:
      label: Game client you play on
      description: e.g. WoW Forever 1.60.1
